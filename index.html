<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    
    <title>专属聊天 - 旗舰AI桌面版</title>
    <link rel="stylesheet" href="style.css">
    <style id="customStyles"></style>
</head>
<body>

    <div class="ios-desktop" id="iosDesktop">
        <div class="desktop-time" id="desktopTime">00:00</div>
        <div class="desktop-date" id="desktopDate">6月16日 星期二</div>
        <div class="grid-apps">
            <div class="app-icon-wrapper" id="appLaunchChat">
                <div class="app-icon">
                    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                </div>
                <span class="app-name">AI 专属私聊</span>
            </div>
        </div>
    </div>

    <div class="chat-container" id="chatAppContainer">
        <div class="header">
            <div class="header-left">
                <button class="btn-action" id="btnBackToDesktop">◀ 返回</button>
            </div>
            <div class="header-center">
                <span class="header-title" id="uiTitle">AI 角色</span>
            </div>
            <div class="header-right">
                <button class="btn-action" id="btnOpenSettings">⚙️ 设置</button>
            </div>
        </div>

        <div class="full-page" id="settingsPage">
            <div class="page-header">
                <span id="btnCloseSettings" style="cursor:pointer; color:#8e8e93;">取消</span>
                <span style="font-weight:bold;">配置面板</span>
                <span id="btnSaveSettings" style="color:#007aff; font-weight:bold; cursor:pointer;">保存</span>
            </div>
            <div class="page-content">
                
                <span class="settings-label" style="color:var(--accent);">🤖 API 大模型中继接口</span>
                <div class="settings-group" style="border: 1px solid rgba(0,122,255,0.2);">
                    <div style="margin-bottom: 12px;">
                        <label class="settings-label" style="font-size:0.7rem;">接口基础 URL (API Base)</label>
                        <input type="text" id="apiBase" class="input-box" placeholder="例如: https://api.openai.com/v1">
                    </div>
                    <div style="margin-bottom: 12px;">
                        <label class="settings-label" style="font-size:0.7rem;">密钥 (API Key)</label>
                        <input type="password" id="apiKey" class="input-box" placeholder="sk-........................">
                    </div>
                    <div>
                        <label class="settings-label" style="font-size:0.7rem;">调用模型 (Model Name)</label>
                        <input type="text" id="apiModel" class="input-box" placeholder="例如: gpt-4o / claude-3-5-sonnet">
                    </div>
                </div>

                <span class="settings-label" style="color:var(--accent);">📝 专属角色扮演人设设定 (System Prompt)</span>
                <div class="settings-group">
                    <textarea id="systemPrompt" class="input-box" rows="5" placeholder="请在这里详细描述AI扮演角色的世界观、性格、说话习惯等。"></textarea>
                </div>

                <span class="settings-label">🤖 AI 角色信息</span>
                <div class="settings-group">
                    <div style="margin-bottom: 12px;">
                        <label class="settings-label">AI 角色昵称</label>
                        <input type="text" id="cfgName" class="input-box">
                    </div>
                    <div>
                        <label class="settings-label">AI 角色头像上传</label>
                        <div class="avatar-uploader-trigger" id="aiAvatarUploader">
                            <div class="avatar-preview-circle" id="preViewAiAvatar"></div>
                            <span class="avatar-upload-tip">从相册/图库中选择一张图片</span>
                        </div>
                    </div>
                </div>

                <span class="settings-label">👤 用户（本人）信息</span>
                <div class="settings-group">
                    <div style="margin-bottom: 12px;">
                        <label class="settings-label">我的昵称</label>
                        <input type="text" id="cfgUserName" class="input-box">
                    </div>
                    <div>
                        <label class="settings-label">我的头像上传</label>
                        <div class="avatar-uploader-trigger" id="userAvatarUploader">
                            <div class="avatar-preview-circle" id="preViewUserAvatar"></div>
                            <span class="avatar-upload-tip">从相册/图库中选择一张图片</span>
                        </div>
                    </div>
                </div>

                <input type="file" id="hiddenFileInput" accept="image/*" style="display:none;">

                <span class="settings-label">🎨 样式个性化定制</span>
                <div class="settings-group">
                    <label class="settings-label">气泡样式 (CSS)</label>
                    <textarea id="cssBubble" class="input-box" rows="2" placeholder=".bubble.ai { ... }"></textarea>
                    <div class="preset-row" id="preBubble"></div>
                    
                    <label class="settings-label" style="margin-top:12px;">整体全局主题 (CSS)</label>
                    <textarea id="cssTheme" class="input-box" rows="2" placeholder="body { ... }"></textarea>
                    <div class="preset-row" id="preTheme"></div>

                    <label class="settings-label" style="margin-top:12px;">字体库 (CSS)</label>
                    <textarea id="cssFont" class="input-box" rows="2" placeholder="* { font-family: ... }"></textarea>
                    <div class="preset-row" id="preFont"></div>
                </div>

                <span class="settings-label">🎵 声效与模拟响应</span>
                <div class="settings-group">
                    <label class="settings-label">提示音效 (URL)</label>
                    <input type="text" id="soundUrl" class="input-box" placeholder="http://.../*.mp3">
                    <div class="preset-row" id="preSound"></div>
                    <div style="margin-top:15px;">
                        <label class="settings-label">打字效果模拟等候时间: <span id="speedVal">1.0</span> 秒</label>
                        <input type="range" id="speedSlider" min="0" max="10" step="0.5" style="width:100%;">
                    </div>
                </div>

                <span class="settings-label" style="color: #34c759;">💾 数据备份与恢复</span>
                <div class="settings-group" style="display: flex; gap: 10px;">
                    <button id="btnExportData" style="flex:1; padding:12px; background:#34c759; color:#fff; border:none; border-radius:8px; font-size:0.85rem; cursor:pointer; font-weight:600;">💾 导出完整备份</button>
                    <button id="btnImportData" style="flex:1; padding:12px; background:#5856d6; color:#fff; border:none; border-radius:8px; font-size:0.85rem; cursor:pointer; font-weight:600;">📥 导入恢复数据</button>
                </div>
                
                <div class="settings-group" style="text-align: center; display: none;" id="pwaInstallContainer">
                    <button id="btnInstallApp" style="width:100%; padding:12px; background:#007aff; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer; margin-bottom:10px;">⬇️ 安装应用到系统桌面</button>
                </div>

                <div class="settings-group" style="text-align: center;">
                    <button id="btnTryClear" style="color:var(--danger); background:none; border:none; font-size:0.95rem; cursor:pointer; width:100%;">清空所有聊天记录</button>
                </div>
            </div>
        </div>

        <div class="messages-area" id="msgBox"></div>

        <div class="input-container">
            <div class="input-area">
                <textarea id="txtInput" rows="1" placeholder="和对方聊点什么吧..."></textarea>
                <button class="btn-send" id="btnSend"> ✔ </button>
            </div>
        </div>
    </div>

    <div class="ios-alert-overlay" id="iosAlert">
        <div class="ios-alert-box">
            <div class="ios-alert-content">
                <div class="ios-alert-title" id="alertTitle">提示</div>
                <div class="ios-alert-msg" id="alertMsg">内容</div>
            </div>
            <div class="ios-alert-footer" id="alertFooter">
                <button class="ios-alert-btn" id="alertConfirm">确定</button>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="app.js"></script>
            <div class="ios-alert-overlay" id="iosAlert">
            <div class="ios-alert-box">
                <div class="ios-alert-content">
                    <div class="ios-alert-title" id="alertTitle">提示</div>
                    <div class="ios-alert-msg" id="alertMsg">内容</div>
                </div>
                <div class="ios-alert-footer" id="alertFooter">
                    <button class="ios-alert-btn" id="alertConfirm">确定</button>
                </div>
            </div>
        </div>

        <script src="api.js"></script>
        <script src="app.js"></script>
</body>
</html>
